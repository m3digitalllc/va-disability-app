version: "3.9"

# All sensitive credentials are mounted into containers via Compose secrets,
# not injected as environment variables. The corresponding files live under
# `./secrets/` (gitignored). To bootstrap a fresh checkout, copy each
# `secrets/*.example` file to `secrets/<name>` and fill in the real value.
#
# Local non-Docker development (`uvicorn app.main:app --reload` from backend/)
# reads the same values from `.env` via pydantic-settings — config.py checks
# environment variables first, then falls back to /run/secrets/<name>.
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  encryption_key:
    file: ./secrets/encryption_key
  jwt_secret:
    file: ./secrets/jwt_secret
  jwt_refresh_secret:
    file: ./secrets/jwt_refresh_secret
  smtp_pass:
    file: ./secrets/smtp_pass

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaapp
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: vadisability
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaapp -d vadisability"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Non-sensitive config only — sensitive values are mounted as files via
      # the `secrets:` block below and read in config.py through
      # _secret_or_file(). DATABASE_URL is assembled from DB_* + POSTGRES_PASSWORD
      # at startup so the password is never in any process env block.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: vadisability
      DB_USER: vaapp
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DOCUMENTS_PATH: /app/data/documents
      ENVIRONMENT: ${ENVIRONMENT:-development}
    secrets:
      - anthropic_api_key
      - encryption_key
      - jwt_secret
      - jwt_refresh_secret
      - smtp_pass
      - postgres_password
    volumes:
      - ./backend/data:/app/data
      - ../skills:/app/skills:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"   # web UI — open http://localhost:8025 to read emails

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    # Nginx needs CHOWN/SETUID/SETGID to drop to the `nginx` worker user, and
    # NET_BIND_SERVICE to bind 80/443 below 1024.
    cap_add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      # nginx:alpine ships with neither curl nor wget; nc is available.
      test: ["CMD-SHELL", "nc -z localhost 80 || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
